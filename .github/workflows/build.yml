name: Build and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kapsel-${{ github.ref }}
  queue: max

jobs:
  build:
    name: Build Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify versioning
        run: python3 -m unittest discover -s tests -v
      - name: Select build version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            version="$(python3 tools/version.py)"
          else
            version=0.0.0-dev
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install build tools
        if: steps.version.outputs.version != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-win32 p7zip-full
      - name: Build and verify portable package
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 tools/package.py --version "$VERSION" --output-dir "$RUNNER_TEMP/kapsel-artifacts"
          cd "$RUNNER_TEMP/kapsel-artifacts"
          sha256sum --check SHA256SUMS
          unzip -tq "Kapsel-$VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.version != ''
        with:
          name: windows-x64
          path: ${{ runner.temp }}/kapsel-artifacts
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main' && needs.build.outputs.version != ''
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-x64
          path: ${{ runner.temp }}/kapsel-artifacts
      - name: Publish package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 tools/publish.py "$VERSION" "$RUNNER_TEMP/kapsel-artifacts"
